<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dff4ac">
  <title>병아리 마을</title>
  <link rel="icon" href="assets/unity/chick-base.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" id="game-shell" aria-label="병아리 마을 모바일 게임">
    <canvas id="game-canvas" width="390" height="844" aria-label="직접 조작하는 병아리 마을"></canvas>
    <header class="hud" aria-label="마을 상태">
      <div class="village-badge"><img src="assets/unity/chick-base.png" alt=""><span><small>DAY <b id="day-count">1</b></small><strong>햇살 마을</strong></span></div>
      <div class="energy-badge" aria-label="남은 기운"><span>기운</span><strong id="energy-count">12</strong><small>/12</small></div>
    </header>
    <section class="resource-bar" aria-label="보유 재료">
      <span><b class="resource-icon wood">◆</b>나무 <strong id="wood-count">2</strong></span>
      <span><b class="resource-icon stone">●</b>돌 <strong id="stone-count">0</strong></span>
      <span><b class="resource-icon sprout">♣</b>새싹 <strong id="sprout-count">1</strong></span>
      <span><b class="resource-icon berry">●</b>열매 <strong id="berry-count">0</strong></span>
    </section>
    <button class="quest-chip" id="quest-button" aria-label="오늘의 의뢰 열기"><img src="assets/unity/quest.png" alt=""><span><small>오늘의 의뢰</small><strong id="quest-summary">빈터를 정리해요</strong></span><b id="quest-total">0/3</b></button>
    <div class="mode-banner" id="mode-banner" hidden><strong id="mode-title">모닥불 놓기</strong><span>빈 잔디를 눌러 설치하세요.</span><button id="cancel-build">취소</button></div>
    <nav class="game-dock" aria-label="게임 메뉴">
      <button id="bag-button"><span class="dock-icon">▣</span><b>가방</b></button>
      <button class="build-main" id="build-button"><span class="dock-icon">⌂</span><b>짓기</b></button>
      <button id="friends-button"><img src="assets/unity/chick-base.png" alt=""><b>친구</b></button>
    </nav>
    <section class="intro-card" id="intro-card" aria-labelledby="intro-title">
      <span class="day-ribbon">첫째 날</span><img src="assets/unity/chick-base.png" alt="삐약이">
      <div><small>새 마을에 도착했어요</small><h1 id="intro-title">빈터를 정리하고<br><em>우리 마을</em>을 만들어요!</h1><p>나무, 돌, 풀을 직접 눌러 재료를 모아주세요.</p></div>
      <button id="start-game">마을 시작</button>
    </section>
    <section class="bottom-sheet" id="build-sheet" hidden aria-label="시설 짓기"><button class="sheet-backdrop" data-close="build-sheet" aria-label="닫기"></button><div class="sheet-card"><span class="sheet-handle"></span><header><span><small>BUILD</small><strong>무엇을 지을까요?</strong></span><button data-close="build-sheet" aria-label="닫기">×</button></header><div class="recipe-list" id="recipe-list"></div></div></section>
    <section class="bottom-sheet" id="friend-sheet" hidden aria-label="병아리와 놀기"><button class="sheet-backdrop" data-close="friend-sheet" aria-label="닫기"></button><div class="sheet-card friend-card"><span class="sheet-handle"></span><header><span><small>MY CHICK</small><strong id="friend-name">삐약이</strong></span><button data-close="friend-sheet" aria-label="닫기">×</button></header><div class="friend-profile"><img id="friend-image" src="assets/unity/chick-base.png" alt=""><p id="friend-status">무엇을 함께 할까요?</p></div><div class="friend-actions"><button data-friend-action="play"><b>♪</b><span>같이 놀기<small>친밀도 +1</small></span></button><button data-friend-action="feed"><b>●</b><span>열매 주기<small>열매 1개</small></span></button><button data-friend-action="rest"><b>☀</b><span>함께 쉬기<small>기운 +2</small></span></button></div></div></section>
    <section class="bottom-sheet" id="quest-sheet" hidden aria-label="오늘의 의뢰"><button class="sheet-backdrop" data-close="quest-sheet" aria-label="닫기"></button><div class="sheet-card"><span class="sheet-handle"></span><header><span><small>TODAY</small><strong>오늘의 의뢰</strong></span><button data-close="quest-sheet" aria-label="닫기">×</button></header><div class="quest-list" id="quest-list"></div><div class="quest-reward"><span>모두 완료 보상</span><strong>새 주민 + 행복 20</strong></div></div></section>
    <section class="bottom-sheet" id="bag-sheet" hidden aria-label="가방"><button class="sheet-backdrop" data-close="bag-sheet" aria-label="닫기"></button><div class="sheet-card"><span class="sheet-handle"></span><header><span><small>INVENTORY</small><strong>내 가방</strong></span><button data-close="bag-sheet" aria-label="닫기">×</button></header><div class="bag-grid" id="bag-grid"></div><p class="bag-tip">마을의 나무, 돌, 풀, 열매 덤불을 눌러 재료를 모을 수 있어요.</p></div></section>
    <div class="speech-bubble" id="speech-bubble" role="status" aria-live="polite"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5c864" />
    <title>식당아리 — 기획 검증 프로토타입</title>
    <link rel="icon" href="assets/ui/chick/icon_chick_001.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-frame" aria-label="식당아리 게임 화면">
        <div class="world-area">
          <canvas id="game-canvas" width="480" height="900" aria-label="레스토랑"></canvas>

        <header class="hud-top" aria-label="보유 재화">
          <div class="currency-pill primary">
            <img src="assets/ui/currency/icon_currency_001.png" alt="도토리" />
            <strong id="acorn-count">0</strong>
          </div>
          <div class="currency-pill">
            <img src="assets/ui/currency/icon_currency_003.png" alt="아이디어" />
            <strong id="idea-count">0</strong>
          </div>
          <div class="currency-pill compact">
            <img src="assets/ui/currency/icon_currency_002.png" alt="보석" />
            <strong id="gem-count">0</strong>
          </div>
          <button id="collection-btn" class="round-button collection-button" type="button" aria-label="도감 열기"><img src="assets/ui/common/icon_btn_book.png" alt="" /><i id="collection-dot" hidden></i></button>
          <button id="reset-btn" class="round-button" type="button" aria-label="처음부터 다시 시작">↺</button>
        </header>

        <button id="promotion-btn" class="promotion-button" type="button" disabled>
          <img class="promotion-icon" src="assets/ui/common/icon_promotion.png" alt="" />
          <span class="promotion-copy">
            <strong>홍보하기</strong>
            <span id="promotion-status">시설을 먼저 설치해 주세요</span>
          </span>
          <span class="promotion-gauge" aria-hidden="true">
            <span id="promotion-fill"></span>
          </span>
        </button>

        <section id="menu-screen" class="menu-screen" hidden aria-live="polite">
          <header class="menu-header">
            <div><span id="menu-kicker">식당아리</span><h2 id="menu-title">메뉴</h2></div>
            <button id="menu-close-btn" type="button" aria-label="메뉴 닫기">×</button>
          </header>
          <div id="menu-tabs" class="menu-tabs"></div>
          <div id="menu-content" class="menu-content"></div>
        </section>

        <section id="install-panel" class="install-panel" hidden aria-live="polite">
          <button id="install-close-btn" class="panel-close" type="button" aria-label="닫기">×</button>
          <img id="install-icon" class="install-icon" alt="" />
          <div class="install-copy">
            <span class="install-kicker">새 설비</span>
            <strong id="install-name">설비 이름</strong>
            <span id="install-description">설비 설명</span>
          </div>
          <button id="install-confirm-btn" class="install-confirm" type="button">
            <img src="assets/ui/currency/icon_currency_001.png" alt="" />
            <span id="install-cost">0</span>
            <strong>설치하기</strong>
          </button>
        </section>

        <div id="toast" class="toast" hidden></div>
        </div>

        <nav class="bottom-nav" aria-label="주요 메뉴">
          <button class="nav-button" type="button" data-screen="recipe"><span><img src="assets/ui/common/icon_mainmenu_recipe.png" alt="" /></span><strong>레시피</strong><i id="recipe-dot" hidden></i></button>
          <button class="nav-button" type="button" data-screen="missions"><span><img src="assets/ui/common/icon_mainmenu_todo.png" alt="" /></span><strong>할 일</strong><i id="mission-dot" hidden></i></button>
          <button class="nav-button" type="button" data-screen="staff"><span><img src="assets/ui/common/icon_mainmenu_staff.png" alt="" /></span><strong>직원</strong></button>
          <button class="nav-button" type="button" data-screen="theme"><span><img src="assets/ui/common/icon_mainmenu_theme.png" alt="" /></span><strong>테마</strong></button>
        </nav>
      </section>
    </main>

    <script src="data/runtime-tables.js"></script>
    <script src="src/game-config.js"></script>
    <script src="src/data-loader.js"></script>
    <script src="game.js"></script>
  </body>
</html>

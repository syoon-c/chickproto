<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5c864" />
    <title>식당아리</title>
    <link rel="icon" href="assets/ui/chick/icon_chick_001.png" />
  <link rel="stylesheet" href="styles.css?v=20260806-cooking-contest" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-frame" aria-label="식당아리 게임 화면">
        <div class="world-area">
          <canvas id="game-canvas" width="480" height="900" aria-label="레스토랑"></canvas>

          <div class="world-controls-layer" aria-label="지역 이동">
            <button id="area-prev-btn" class="area-arrow area-arrow-left" type="button" hidden aria-label="레스토랑으로 이동"><span>‹</span><small>식당</small></button>
            <button id="area-next-btn" class="area-arrow area-arrow-right" type="button" hidden aria-label="야외 뷔페로 이동"><span>›</span><small>뷔페</small></button>
          </div>
          <button id="contest-button" class="contest-button" type="button" hidden aria-label="요리 대회 열기">
            <img src="assets/ui/mission/icon_mainmission_001.png" alt="" />
            <span><strong>요리 대회</strong><small>하루 1회 무료</small></span>
          </button>

          <button id="chef-dialogue" class="chef-dialogue" type="button" hidden aria-live="polite">
            <span>요리사 병아리</span>
            <strong id="chef-dialogue-text"></strong>
            <small>눌러서 계속</small>
          </button>

        <header class="hud-top" aria-label="보유 재화">
          <div class="currency-pill primary">
            <img src="assets/ui/currency/icon_currency_001.png" alt="도토리" />
            <strong id="acorn-count">0</strong>
          </div>
          <div class="currency-pill compact">
            <img src="assets/ui/currency/icon_currency_002.png" alt="보석" />
            <strong id="gem-count">0</strong>
          </div>
          <div class="debug-tools-anchor">
            <button id="reset-btn" class="round-button" type="button" aria-label="처음부터 다시 시작">↺</button>
            <button id="debug-toggle-btn" class="debug-toggle-button" type="button" aria-label="디버그 도구 열기" aria-expanded="false">DEBUG</button>
          </div>
        </header>

        <div id="drop-boost-badge" class="drop-boost-badge" hidden><span>🍃</span><strong>드랍 2배</strong><b id="drop-boost-time">1:00</b></div>

        <section id="debug-panel" class="debug-panel" hidden aria-label="테스트용 디버그 도구">
          <header><div><small>TEST ONLY</small><strong>디버그 도구</strong></div><button id="debug-close-btn" type="button" aria-label="닫기">×</button></header>
          <button id="debug-install-all-btn" class="debug-install-all" type="button">초기 설비 전체 설치</button>
          <div class="debug-resource-tool">
            <label for="debug-resource-type">재화 추가</label>
            <div>
              <select id="debug-resource-type" aria-label="추가할 재화">
                <option value="acorns">도토리</option>
                <option value="ideas">아이디어</option>
                <option value="gems">보석</option>
                <option value="stickers">스티커</option>
              </select>
              <input id="debug-resource-amount" type="number" min="1" step="1" value="1000" inputmode="numeric" aria-label="추가할 수량" />
            </div>
            <button id="debug-add-resource-btn" type="button">추가하기</button>
          </div>
          <div class="debug-ingredient-tool">
            <label for="debug-ingredient-type">재료 획득</label>
            <div>
              <select id="debug-ingredient-type" aria-label="추가할 재료"></select>
              <input id="debug-ingredient-amount" type="number" min="1" step="1" value="10" inputmode="numeric" aria-label="추가할 재료 수량" />
            </div>
            <button id="debug-add-ingredient-btn" type="button">재료 추가하기</button>
          </div>
          <div class="debug-special-tool">
            <label for="debug-special-type">특수 손님 테스트</label>
            <div><select id="debug-special-type"><option value="thief">도둑</option><option value="merchant">재료 상인</option><option value="fairy">바람의 요정</option><option value="trader">교환상</option></select><button id="debug-spawn-special-btn" type="button">등장</button></div>
          </div>
        </section>

        <section id="menu-screen" class="menu-screen" hidden aria-live="polite">
          <header class="menu-header">
            <div><span id="menu-kicker">식당아리</span><h2 id="menu-title">메뉴</h2></div>
            <button id="menu-close-btn" type="button" aria-label="메뉴 닫기">×</button>
          </header>
          <div id="menu-tabs" class="menu-tabs"></div>
          <div id="menu-content" class="menu-content"></div>
          <div id="recipe-reveal" class="recipe-reveal" hidden></div>
        </section>

        <section id="install-panel" class="install-panel" hidden aria-live="polite">
          <button id="install-close-btn" class="panel-close" type="button" aria-label="닫기">×</button>
          <img id="install-icon" class="install-icon" alt="" />
          <div class="install-copy">
            <span class="install-kicker">새 설비</span>
            <strong id="install-name">설비 이름</strong>
            <span id="install-description">설비 설명</span>
          </div>
          <button id="install-confirm-btn" class="install-confirm" type="button">
            <img src="assets/ui/currency/icon_currency_001.png" alt="" />
            <span id="install-cost">0</span>
            <strong>설치하기</strong>
          </button>
        </section>

        <section id="special-promotion-panel" class="special-promotion-panel" hidden aria-label="특별 홍보 재료 선택">
          <header><div><small>손님 초대</small><strong>특별 홍보</strong></div><button id="special-promotion-close" type="button" aria-label="닫기">×</button></header>
          <p>선택한 재료를 주는 손님만 1분간 찾아옵니다.</p>
          <label class="special-promotion-search"><span aria-hidden="true">⌕</span><input id="special-promotion-search" type="search" placeholder="재료 이름 검색" autocomplete="off" /></label>
          <div id="special-promotion-list" class="special-promotion-list"></div>
          <div id="special-promotion-detail" class="special-promotion-detail" hidden></div>
        </section>

        <section id="special-visitor-panel" class="special-visitor-panel" hidden aria-label="특수 손님 안내">
          <header><div class="special-visitor-heading"><img id="special-visitor-icon" src="assets/ui/chick/icon_chick_rich.png" alt=""/><div><small>특수 손님</small><strong id="special-visitor-title">재료 상인</strong></div></div><button id="special-visitor-close" type="button" aria-label="닫기">×</button></header>
          <p id="special-visitor-message"></p>
          <div id="special-visitor-content" class="special-visitor-content"></div>
        </section>

        <section id="offline-reward-panel" class="offline-reward-panel" hidden aria-label="야외 뷔페 오프라인 정산">
          <span class="offline-reward-kicker">다시 오셨군요!</span>
          <img src="assets/ui/facility/icon_facility_1_table_wood.png" alt="" />
          <strong>야외 뷔페 정산</strong>
          <p id="offline-reward-time">자리를 비운 동안</p>
          <div><img src="assets/ui/currency/icon_currency_001.png" alt="" /><b id="offline-reward-amount">0</b></div>
          <button id="offline-reward-claim" type="button">도토리 받기</button>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        <div id="guest-toast" class="new-guest-alert" role="status" aria-live="polite" hidden></div>
        </div>

        <div id="bottom-controls" class="bottom-controls">
          <nav class="bottom-nav" aria-label="주요 메뉴">
            <button class="nav-button" type="button" data-screen="theme"><span><img src="assets/ui/common/icon_mainmenu_theme.png" alt="" /></span><strong id="theme-nav-label">테마</strong></button>
            <button class="nav-button" type="button" data-screen="recipe"><span><img src="assets/ui/common/icon_mainmenu_recipe.png" alt="" /></span><strong id="recipe-nav-label">레시피</strong><i id="recipe-dot" hidden></i></button>
            <button class="nav-button" type="button" data-screen="collection"><span><img src="assets/ui/chick/icon_chick_001.png" alt="" /></span><strong>손님</strong><i id="collection-dot" hidden></i></button>
          </nav>
          <div class="promotion-stack">
            <button id="special-promotion-btn" class="special-promotion-button" type="button" hidden>
              <span class="special-promotion-spark" aria-hidden="true">✦</span>
              <span id="special-promotion-label">특별 홍보</span>
            </button>
            <button id="promotion-btn" class="promotion-button" type="button" disabled>
              <img class="promotion-icon" src="assets/ui/common/icon_promotion.png" alt="" />
              <span class="promotion-copy"><strong>홍보하기</strong></span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="data/runtime-tables.js?v=20260729-restaurant-only"></script>
  <script src="src/game-config.js?v=20260806-recipe-price-progression"></script>
    <script src="src/data-loader.js?v=20260729-restaurant-only"></script>
    <script src="game.js?v=20260806-cooking-contest"></script>
  </body>
</html>
